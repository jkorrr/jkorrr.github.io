<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jathin’s notes and photographs from Belgium." />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>belgium — travel — jathin</title>
    <script>
      (() => {
        let theme = "dark";
        try { if (window.localStorage.getItem("jkorr-theme") === "light") theme = "light"; } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#F7F7F4" : "#050505";
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
